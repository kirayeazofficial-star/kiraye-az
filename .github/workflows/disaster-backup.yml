name: Encrypted disaster backup
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Request source (manual, daily-google-clock, verified-deployment)
        default: manual
        required: true
      expected_commit:
        description: Deployed commit, if requested immediately after deployment
        required: false
  push:
    branches: [main]
    paths:
      - scripts/backup/**
      - scripts/request-cloud-backup.mjs
      - tests/backup/**
      - .github/workflows/disaster-backup.yml
permissions:
  contents: read
concurrency:
  group: kirayeal-disaster-backup
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install -r scripts/backup/requirements.txt
      - run: python3 -m unittest discover -s tests/backup -v
      - run: node --test tests/backup/deployment-trigger.test.mjs
  backup:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && vars.KIRAYE_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install matching PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          sudo install -m 644 /tmp/pgdg.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - run: python3 -m pip install -r scripts/backup/requirements.txt
      - name: Snapshot, encrypt, upload, verify, retain
        env:
          KIRAYE_BACKUP_CONFIG: ${{ secrets.KIRAYE_BACKUP_CONFIG }}
          KIRAYE_BACKUP_DEPLOY_COMMIT: ${{ inputs.expected_commit }}
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/backup/run.py
      # No database, secret configuration, images or raw SQL are uploaded as Actions artifacts.
