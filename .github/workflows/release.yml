# Builds the site on GitHub (plenty of memory) and publishes the ready-to-run
# files to the `site` branch (history is kept so cPanel can pull normally). cPanel deploys that branch without building.
name: Build release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install --no-audit --no-fund
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://kirayeal.az
        run: |
          node scripts/check-public-env.mjs
          npm run build -- --webpack
      - name: Assemble release
        run: |
          mkdir -p /tmp/release/.next
          cp -rL .next/standalone /tmp/release/.next/standalone
          cp .next/BUILD_ID /tmp/release/.next/BUILD_ID
          cp app.js /tmp/release/app.js
          cp scripts/install-release.mjs /tmp/release/install-release.mjs
          cp scripts/run-host-migrations.mjs /tmp/release/run-host-migrations.mjs
          cp -r host /tmp/release/host
          cp deploy/release.cpanel.yml /tmp/release/.cpanel.yml
          printf '{"commit":"%s","buildId":"%s"}\n' "$GITHUB_SHA" "$(cat .next/BUILD_ID)" > /tmp/release/RELEASE.json
      - name: Publish site branch
        run: |
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" site >/dev/null 2>&1; then
            git clone -q --branch site --single-branch "$REMOTE" /tmp/site
          else
            git init -q -b site /tmp/site
            git -C /tmp/site remote add origin "$REMOTE"
          fi
          cd /tmp/site
          git config user.name "kirayeal-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/release/. .
          git add -A -f
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Release ${GITHUB_SHA::7}"
          git push origin site
